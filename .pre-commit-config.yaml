# Run the same lint + type checks as CI before each commit.
# Install once per clone: `pre-commit install`.
#
# The ruff and mypy `rev:` pins below MUST match the `==` pins in
# `requirements_test.txt`. CI installs those exact versions; a drifting
# hook rev means the local gate lints with a different ruleset than the
# one that decides green-on-main. Bump both in the same commit.
#
# The vendored font licence is third-party text kept verbatim. A
# `--all-files` run would otherwise reformat it, so it is excluded here
# rather than rewritten.
exclude: ^custom_components/wiener_linien_austria/www/fonts/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5 # keep in sync with ruff== in requirements_test.txt
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1 # keep in sync with mypy== in requirements_test.txt
    hooks:
      - id: mypy
        additional_dependencies: [homeassistant, voluptuous]
        args: [--strict, --ignore-missing-imports]
        files: ^custom_components/wiener_linien_austria/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The bundled card JS is generated by `npm run build`, and rolldown emits
      # no trailing newline. Letting this hook "fix" it would rewrite the file
      # after the build, leaving the committed bundle out of sync with a fresh
      # one — which validate.yml asserts byte-for-byte.
      - id: trailing-whitespace
        exclude: ^custom_components/.*/www/.*\.js$
      # Same reason as above — never let a hook rewrite a generated bundle.
      - id: end-of-file-fixer
        exclude: ^custom_components/.*/www/.*\.js$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
