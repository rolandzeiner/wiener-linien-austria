name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  no-dev-fixture:
    # `_dev_fixture.py` is a gitignored, dev-only hook some siblings
    # ship to inject a recorded payload during local development. It
    # must never enter the repo — gitignore covers accidental staging,
    # this guards against `git add -f` or the rule being deleted. Loud,
    # fast, first job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify _dev_fixture.py is not committed
        run: |
          if [ -f custom_components/wiener_linien_austria/_dev_fixture.py ]; then
            echo "::error::custom_components/wiener_linien_austria/_dev_fixture.py must never be committed (dev-only hook)."
            exit 1
          fi

  compile-floor-python:
    # Every other job runs the CI interpreter (3.14). `hacs.json` promises
    # Home Assistant >= 2025.6.0, which runs on Python 3.13 — so the whole
    # gate was structurally blind to syntax that parses on 3.14 and not on
    # the floor. v1.7.1 shipped PEP 758 `except A, B:` (ruff's
    # target-version was set to the CI interpreter, not the support floor)
    # and failed to import for every user below 3.14 — issue #91.
    #
    # `ruff check` now catches this too, since target-version is pinned to
    # the floor in pyproject.toml. This job is the independent backstop: it
    # asks the real interpreter, so it also covers syntax no linter rule
    # models. Bump `python-version` only together with the `homeassistant`
    # floor in `hacs.json` and `target-version` in `pyproject.toml`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Byte-compile the shipped package on the oldest supported Python
        run: python -m compileall -q custom_components/wiener_linien_austria

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned to 3.14 — HA core 2026.5.0 requires Python ≥3.14.2
          # and PHACC 0.13.317+ wraps that HA. The earlier pyo3 0.24
          # blocker is gone: orjson 3.11.8, Pillow 12.2.0, and
          # pydantic-core 2.46.2 all ship cp314 wheels (verified
          # 2026-05-07 in a local Python 3.14 venv against the full
          # PHACC 0.13.329 dep tree). Bump again when HA core jumps
          # to 3.15.
          python-version: "3.14"
      - name: Install uv
        # uv replaces pip for resolution + install: faster, cached, and
        # consistent with the local dev workflow (uv-built venvs). Its
        # resolver surfaces hard PHACC transitive pins (e.g.
        # pytest-asyncio==1.4.0) just as clearly as pip 26.1 did, which is
        # what lets requirements_test.txt declare so little.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements_test.txt
      - name: Run Linter (Ruff)
        run: ruff check .
      - name: Check formatting (Ruff)
        # Separate from `ruff check`, which never inspects formatting.
        # Without this the formatter drifts silently until someone runs
        # it, and the catch-up lands as one unreviewable tree-wide diff
        # (2026-07: ~18 months of drift, 15-28 files per repo).
        run: ruff format --check .
      - name: Run mypy (strict)
        run: mypy --strict --ignore-missing-imports custom_components/wiener_linien_austria
      - name: Run tests
        run: pytest tests/ -v
      - name: Per-module coverage floor
        # `--cov-fail-under` in pytest.ini is a single number over the whole
        # package. The Silver `test-coverage` rule is per module, and the
        # two are not the same gate: this repo sat at 91.81% total with
        # diagnostics.py at 84% and quality_scale.yaml claiming `done`.
        # pytest writes coverage.json; this reads the per-file numbers.
        run: python scripts/check_module_coverage.py

  validate-card:
    # Rebuilds all three Lovelace card bundles from src/ and verifies each
    # output is valid JS. Catches TS errors, missing deps, and high-severity
    # npm advisories before they reach the served www/*.js files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard against backticks inside Lit css/html templates
        # The `css\`...\`` and `html\`...\`` tagged templates are
        # backtick-delimited; a stray backtick inside a comment or a
        # CSS class reference (`.foo`) terminates the literal early
        # and the rest of the template parses as JavaScript. Build
        # still succeeds (the bundle is valid JS) but the card crashes
        # at module load. Cheapest possible CI guard: scan the body of
        # every cardStyles / editorStyles / html`` template for an
        # unescaped backtick. Critical for wiener-linien because all
        # three cards are 1900+ lines of Lit templates each.
        run: |
          if perl -0777 -ne '
            while (m{(css|html)\`(.*?)(?<!\\)\`}gs) {
              my ($tag, $body) = ($1, $2);
              if ($body =~ /\`/) {
                print "Stray backtick inside ${tag}\`...\` template\n";
                print "Surrounding text:\n";
                print substr($body, 0, 240), "\n...\n";
                exit 1;
              }
            }
            exit 0;
          ' src/*.ts src/**/*.ts; then
            echo "OK: no stray backticks in tagged templates"
          else
            echo "::error::A backtick inside a Lit css/html template will" \
              "terminate the literal early and silently break the card." \
              "Use single quotes, double quotes, or word descriptions in" \
              "comments and class-name references."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install card deps
        run: npm ci
      - name: Audit production deps
        # --omit=dev keeps the gate enforceable; without it build-tooling
        # advisories (which never ship to users) flood the report and the
        # team learns to ignore failures.
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check (strict)
        # The ONLY type-check in the pipeline. Rolldown transpiles without
        # type-checking, exactly as swc did, so nothing else in
        # this workflow would notice a type error — a broken build would go
        # green all the way to the bundle. Never make this step conditional.
        run: npx tsc --noEmit
      - name: Card unit tests
        # Pure-function coverage of the three config normalisers, the
        # departure filter and the time helpers, plus component-level smoke
        # tests for the three cards and the three editors. The normaliser
        # tests double as the spec for cross-card config defaults, which is
        # where this integration's drift has historically hidden.
        run: npm test
      - name: Card coverage floor
        # A ratchet, not a target. Thresholds sit a few points under the
        # measured number so a legitimate refactor doesn't trip them,
        # while a chunk of newly-untested code does.
        #
        # Read the number carefully before "improving" it: v8 instruments
        # only modules a run imports, so before card-smoke.test.ts existed
        # the three card entrypoints (6,568 lines, the entire user-visible
        # surface) were absent from the report ENTIRELY rather than listed
        # at 0%. The headline was 56.35% over a denominator that excluded
        # the largest files in the tree; adding the smoke tests moved
        # covered statements 833 -> 1480 and the percentage DOWN to 52.59.
        # A falling number here can mean the denominator got honest.
        run: npm run test:coverage:gate
      - name: Build card bundles
        run: npm run build
      - name: Assert the committed bundles match a fresh build
        # The build above regenerates www/ from src/. Any diff means a
        # committed bundle is stale — someone changed src/ and didn't
        # rebuild. This repo ships THREE bundles (modern, retro, flap),
        # so the whole www/ directory is checked rather than one file;
        # www/fonts/ is not generated and will never diff.
        #
        # Nothing else in the gate catches this:
        # tests/test_card_version.py compares manifest.json against
        # src/const.ts, i.e. source vs source, never the built artefact.
        # Shipping a stale bundle is the infinite-reload-banner bug: the
        # card's WebSocket version check sees the old CARD_VERSION, shows
        # the reload banner, the reload re-serves the same stale JS, and
        # the banner comes straight back — for every HACS user.
        run: |
          if ! git diff --exit-code -- custom_components/wiener_linien_austria/www/; then
            echo "::error::A committed card bundle differs from a fresh build."
            echo "::error::Run 'npm run build' and commit custom_components/wiener_linien_austria/www/."
            exit 1
          fi
      - name: Syntax-check modern bundle
        run: node -c custom_components/wiener_linien_austria/www/wiener-linien-austria-card.js
      - name: Syntax-check retro bundle
        run: node -c custom_components/wiener_linien_austria/www/wiener-linien-austria-retro-card.js
      - name: Syntax-check flap bundle
        run: node -c custom_components/wiener_linien_austria/www/wiener-linien-austria-flap-card.js
