version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      python-dev:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      card-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"          # no prefix-development — unsupported here
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      pre-commit:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The ruff and mypy hook revs are manually kept equal to the `==`
      # pins in requirements_test.txt (see .pre-commit-config.yaml).
      # Letting Dependabot float them here would desync the local gate
      # from CI — precisely what the exact pins exist to prevent. Bump
      # these two by hand, in the same commit as the pin.
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
      - dependency-name: "https://github.com/pre-commit/mirrors-mypy"
