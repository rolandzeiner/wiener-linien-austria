[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Hard cap so a hung async fixture surfaces as a failure, not as a CI
# job that idles for 6 hours waiting for the runner to time it out.
# The suite runs in a couple of seconds, so 15s is ample headroom while
# still surfacing a hang quickly. HA core runs its own suite at
# --timeout=9.
timeout = 15
# Unknown @pytest.mark.* names fail the run instead of warning.
# Must be the INI key, not `--strict-markers` in addopts: pytest 9 reads
# it via `config.getini("strict_markers")` (_pytest/mark/structures.py:588),
# which the addopts flag does not reach — verified, it silently no-ops.
strict_markers = true
# Coverage gate: 95% floor on the package total. Coverage source is
# configured in pyproject.toml [tool.coverage.run].
#
# The package total is only half the gate. The Silver `test-coverage` rule
# is per MODULE, and a single number over the whole package cannot express
# that — one module can sit at 80% while the other twelve carry the average
# past the floor. That was the actual state of this repo at 91.81% total
# with diagnostics.py at 84%. `--cov-report=json` writes coverage.json so
# `scripts/check_module_coverage.py` can enforce the per-module half; CI
# runs it right after pytest. Run it locally too — pytest alone will not
# tell you a module regressed.
addopts = --cov --cov-fail-under=95 --cov-report=json
markers =
    real_domain_cooldown: keep the real DOMAIN_COOLDOWN_SECONDS instead of zeroing it (see tests/conftest.py)
    allow_deprecated_ha_api: test intentionally exercises a deprecated HA API
# Turn DeprecationWarning into a test failure. What this actually
# catches: deprecated *library* calls (aiohttp, PHACC, HA helpers)
# reached through our own code paths. That is worth having.
#
# What it does NOT catch: HA integration-API deprecations. HA reports
# those via `frame.report_usage` -> `_LOGGER.warning`
# (homeassistant/helpers/frame.py:393), never `warnings.warn`. The
# `no_deprecated_ha_api` autouse fixture in tests/conftest.py covers that
# channel instead — on every test, and for both of HA's message shapes.
#
# Two known limits:
#   * A third-party deprecation outside the three ignore scopes below
#     turns CI red with no first-party cause. HA core avoids this with
#     ~150 targeted per-library ignores rather than a blanket error.
#     Add new ignores in that style —
#     `ignore:<message>:DeprecationWarning:<module>` — with a link to
#     the upstream issue.
#   * PendingDeprecationWarning is not caught: it is not a subclass of
#     DeprecationWarning.
filterwarnings =
    error::DeprecationWarning
    # RuntimeWarning is an error for the same reason DeprecationWarning is:
    # the standard everywhere else in this gate is that a warning is a
    # failure. Catches the in-control-flow cases (a sync call on an async
    # API, an invalid numeric op).
    #
    # It does NOT catch `coroutine ... was never awaited`, which is the
    # shape that actually showed up here — four of them, from a mocked
    # `resp.raise_for_status()` returning an un-awaited coroutine. That
    # warning is emitted while the coroutine is being finalised, and
    # Python discards any exception raised there ("Exception ignored while
    # finalizing coroutine"), so converting it to an error cannot fail a
    # test. Verified on 3.14.7, not assumed. Those four were fixed at the
    # source instead — see `_stop_batch_timers` in tests/test_init_extras.py
    # — so the only defence against the next one is reading the warnings
    # summary. `-q` still prints it; don't tune it away.
    error::RuntimeWarning
    ignore::DeprecationWarning:homeassistant.*
    ignore::DeprecationWarning:pytest_homeassistant_custom_component.*
    ignore::DeprecationWarning:aiohttp.*
