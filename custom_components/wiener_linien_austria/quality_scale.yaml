rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not provide any service actions.
  appropriate-polling:
    status: done
  brands:
    status: done
    comment: Icons shipped in custom_components/wiener_linien_austria/brand/ (icon.png 256x256, icon@2x.png 512x512). HA 2026.3+ reads this locally; the home-assistant/brands repo no longer accepts custom-integration PRs.
  common-modules:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Coordinator pattern; entities don't subscribe to events directly.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
  test-before-setup:
    status: done
  unique-config-entry:
    status: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
    comment: >-
      Both entities deliberately override CoordinatorEntity.available: they stay
      available while the coordinator holds any prior data, so a transient fetch
      failure keeps the cached board on screen instead of blanking three cards.
      The availability signal that override suppresses is served by
      binary_sensor.<stop>_stale (device_class problem), which reports
      last_update_success going False and serverTime ageing past three polling
      intervals. Entities go unavailable only before the first successful fetch,
      when there is genuinely nothing to show. An earlier revision of this
      comment claimed stock CoordinatorEntity behaviour, which the override has
      never allowed.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: DataUpdateCoordinator logs UpdateFailed warnings once and an info message on recovery.
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: Wiener Linien OGD has no credentials; the coordinator has no auth branch and no token can expire.
  test-coverage:
    status: done
    comment: >-
      Every module clears the Silver >95% floor, enforced two ways because
      one number cannot express the rule: pytest.ini carries
      --cov-fail-under=95 for the package total, and
      scripts/check_module_coverage.py reads the per-file coverage.json and
      fails on any module below 95%. Both run in CI. The per-module check
      exists because the package total hid real gaps — the repo sat at
      91.81% overall while diagnostics.py was at 84%, card_registration.py
      87%, static.py 87% and __init__.py 88%, and this rule was already
      marked done. Covered: config flow (3 steps + reconfigure +
      search-again + abort reasons + the static-picker filters and the
      /monitor probe's bad-payload branches), coordinator (parse,
      rate-limit, cooldown, async_setup coord population, tram/bus fixture,
      stops_ahead enrichment + fail-soft + unknown-line + no-catalogue
      branches, naive/aware timestamp handling), sensor (MAX_DEPARTURES cap,
      alerts matching, availability), binary_sensor (both staleness signals,
      the unknown-before-first-fetch state, cadence-scaled threshold),
      __init__ (both periodic timers incl. their safety nets, batch dereg
      after teardown, async_remove_entry last-entry gating), static
      catalogue (memoised load + concurrent-caller sharing + failed-load
      eviction, background-refresh lost-update guard, weekly refresh store
      failures, malformed CSV rows, corrupt persisted payloads, executor
      offload), alerts, card registration (Lovelace retry + give-up,
      delete-and-recreate fallback, LOVELACE_DATA shim), and diagnostics.

  # Gold
  devices:
    status: done
    comment: DeviceInfo on entities + explicit dr.async_get_or_create in __init__.py.
  diagnostics:
    status: done
  discovery:
    status: exempt
    comment: Cloud/HTTP integration with no local discoverable component.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: exempt
    comment: Cloud API; no physical devices. Flip to `todo` for device integrations.
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: Single device per config entry; no runtime device discovery.
  entity-category:
    status: exempt
    comment: All entities are primary data. Flip if you add diagnostic/config entities.
  entity-device-class:
    status: done
    comment: Stop sensor uses SensorDeviceClass.DURATION with UnitOfTime.MINUTES.
  entity-disabled-by-default:
    status: exempt
    comment: No non-essential entities. Flip if you add rarely-used ones.
  entity-translations:
    status: done
  exception-translations:
    status: done
  icon-translations:
    status: done
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
    comment: Coordinator has raise/clear helpers; raise real issues when degraded conditions occur.
  stale-devices:
    status: exempt
    comment: See dynamic-devices.

  # Platinum
  async-dependency:
    status: done
    comment: Only aiohttp (async) used.
  inject-websession:
    status: done
    comment: async_get_clientsession(hass) in coordinator and config flow.
  strict-typing:
    status: done
    comment: py.typed marker present; CI runs mypy --strict.
