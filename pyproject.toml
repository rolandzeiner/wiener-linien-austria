# Config home for ruff, mypy, and coverage. Pytest config stays in pytest.ini.
# Pre-commit and CI may still pass equivalent CLI flags — they are now
# redundant with this file but harmless. Trim them as confidence grows.

[tool.ruff]
# MUST track the OLDEST Python we support, not the one CI runs. `hacs.json`
# promises Home Assistant >= 2025.6.0, which runs on Python 3.13. Setting this
# to the CI interpreter (3.14) authorises ruff to emit syntax those users
# cannot parse, and then declines to flag it — that shipped in v1.7.1 as
# PEP 758 unparenthesized `except A, B:` in 11 places, a hard SyntaxError on
# 3.12/3.13 that took the whole integration down (issue #91). CI is 3.14-only,
# so nothing in the gate could see it. Raise this only together with the
# `homeassistant` floor in `hacs.json` and the `compile-floor-python` job.
#
# Raised py312 -> py313 in v2.0.0 alongside the 2025.1.0 -> 2025.6.0 floor
# bump. 2025.6.0 is the release that introduced config subentries, so the
# floor buys the option on that shape without spending a second breaking
# bump later; 2025.3.0 would have been enough for
# `AddConfigEntryEntitiesCallback` alone.
target-version = "py313"
line-length = 88

# Ruff's default is `E4,E7,E9,F` — pyflakes plus a slice of pycodestyle, and
# nothing else. The tree turned out to be clean under most of what was
# missing (isort, pyupgrade, bugbear, flake8-comprehensions, pathlib,
# logging, return, and a dozen more all reported ZERO violations before this
# block existed), so the list below is close to free: it locks in a standard
# the code already met rather than imposing a new one.
#
# The tell that it should have existed all along: seven `# noqa: BLE001`
# directives were sitting in __init__.py, batch.py, card_registration.py and
# static.py suppressing a rule that had never been enabled. They were dead
# text. `BLE` below makes each of those broad-except decisions an enforced,
# deliberate one, and `RUF100` stops the next dead directive going unnoticed.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default set, kept explicit
    "I",                    # isort
    "UP",                   # pyupgrade — safe ONLY while target-version is
                            # the support floor; see the note above it
    "B",                    # flake8-bugbear
    "C4",                   # flake8-comprehensions
    "RET",                  # flake8-return
    "PTH",                  # flake8-use-pathlib
    "SIM",                  # flake8-simplify
    "LOG", "G",             # logging correctness + logging-format
    "T20",                  # no stray print()
    "ASYNC",                # flake8-async
    "DTZ",                  # naive datetimes — the M5 class of bug
    "TID",                  # tidy imports
    "ISC",                  # implicit str concat
    "PIE", "RSE", "FURB", "PERF",
    "BLE",                  # the seven noqa directives above
    "SLF",                  # private-member access across class boundaries
    "RUF",                  # ruff-specific, incl. RUF100 dead-noqa
]
# `×` (256×256, 2× retry) and `–` (numeric ranges) are deliberate typography
# in docstrings and comments, not homoglyph typos. Allowing them beats
# ASCII-fying prose that reads better with them.
allowed-confusables = ["×", "–"]

ignore = [
    # `_download_text` / `_download_or_fail_soft` take an
    # `aiohttp.ClientTimeout` that is handed straight to the session, not
    # the seconds-float the rule assumes should have been an
    # `asyncio.timeout` at the call site. The rule's premise doesn't hold.
    "ASYNC109",
]

# Deliberately NOT selected, so nobody has to re-derive this:
#   S    (bandit)       572 hits, almost all `assert` in tests. Per-file-ignore
#                       gymnastics for zero security value — this component has
#                       no auth surface.
#   COM  (commas)       262 hits, and ruff's own docs say COM conflicts with
#                       `ruff format`. Never both.
#   D    (pydocstyle)   55 hits. The docstrings here are deliberately prose-heavy
#                       and D205/D401 would fight about 30 good ones.
#   PL   (pylint)       113 hits, 67 of them PLR2004 magic-value and 36 PLC0415
#                       import-outside-top-level — every one of the latter a
#                       deliberate lazy import.
#   TC, ARG, TRY, EM    Each needs a judgement pass; none is a correctness rule.

[tool.ruff.lint.per-file-ignores]
# 52 of the 56 SLF hits are tests reaching into coordinator internals, which
# is what a test for a memoisation cache is supposed to do. The 4 in
# production were the real finding and are fixed (see
# `WienerLinienAustriaCoordinator.cached_attrs`).
"tests/*" = ["SLF"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/wiener_linien_austria"]

[tool.coverage.run]
source = ["custom_components/wiener_linien_austria"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
